[project]
name = "ai-sre"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=24.0.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.115.0",
    "flake8>=7.0.0",
    "ipykernel>=7.3.0",
    "isort>=5.13.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-litellm>=0.7.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langchain-openrouter>=0.2.8",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.12.4",
    "litellm>=1.100.1",
    "mcp>=1.30.0",
    "pandas>=3.0.5",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.5.0",
    "sentence-transformers>=6.0.1",
    "tiktoken>=0.14.0",
    "upstash-redis>=1.8.0",
    "uvicorn>=0.30.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

